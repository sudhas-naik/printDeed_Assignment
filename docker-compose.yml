services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer
      POSTGRES_DB: transfer
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer -d transfer"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
